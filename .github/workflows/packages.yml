# Reusable pipeline: regression suite, one static backend build and native
# packages for every supported family. Called by ci.yml and release.yml so CI
# exercises exactly the release build path.
#
# IMPORTANT for persistent self-hosted runners:
# - Never use job-level `container:` for jobs that touch GITHUB_WORKSPACE.
#   GitHub runs those containers as root, which can leave root-owned files in
#   the persistent workspace and make the next actions/checkout cleanup fail.
# - Package containers below receive the checkout read-only. Build output is
#   copied back with `docker cp`, which creates local files as the runner user.
name: Build and verify packages

on:
  workflow_call:
    inputs:
      release-repo:
        description: Self-update source embedded into the binary and /etc/citizen-launcher/release-repo
        type: string
        required: true

permissions:
  contents: read

env:
  CITIZEN_LAUNCHER_RELEASE_REPO: ${{ inputs.release-repo }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Regression suite
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      # Recovers automatically from files left root-owned by older container jobs.
      - name: Repair workspace ownership
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:13 \
            chown -R --no-dereference "$(id -u):$(id -g)" /workspace
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Check verification dependencies
        run: |
          missing=()
          for cmd in python3 dpkg-deb dpkg-buildpackage zstd jq shellcheck openssl; do
            command -v "$cmd" >/dev/null 2>&1 || missing+=("$cmd")
          done
          if command -v python3 >/dev/null 2>&1 && ! python3 -c 'import yaml' >/dev/null 2>&1; then
            missing+=(python3-yaml)
          fi
          if ((${#missing[@]})); then
            printf '::error::Missing self-hosted runner dependencies: %s\n' "${missing[*]}"
            echo 'Install once on the Debian runner host:'
            echo '  sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml dpkg-dev zstd jq shellcheck openssl'
            exit 1
          fi
      - name: ShellCheck (errors only)
        run: shellcheck -S error $(git ls-files '*.sh') integrations/omarchy/citizenctl
      - name: Full regression suite
        run: bash ./tests/full-verify.sh

  backend:
    name: Static backend
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Repair workspace ownership
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:13 \
            chown -R --no-dereference "$(id -u):$(id -g)" /workspace
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build
        run: bash ./build.sh
      - name: Check version and linkage
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$(./backend/bin/citizen-launcher --version)" = "$VERSION"
          file backend/bin/citizen-launcher | tee /dev/stderr | grep -q 'statically linked'
          readelf -n backend/bin/citizen-launcher | grep -q 'GNU_BUILD_ID'
      - uses: actions/upload-artifact@v7
        with:
          name: backend-bin
          path: backend/bin/citizen-launcher
          if-no-files-found: error
          retention-days: 7

  deb:
    name: Debian package + generic tarball
    needs: backend
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Repair workspace ownership
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:13 \
            chown -R --no-dereference "$(id -u):$(id -g)" /workspace
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: backend-bin
          path: backend/bin
      - name: Build and verify .deb and tarball
        run: |
          chmod 0755 backend/bin/citizen-launcher
          bash ./tests/package-verify.sh
      - name: Install smoke test (Debian 13, Ubuntu 24.04)
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          for image in debian:13 ubuntu:24.04; do
            echo "::group::$image"
            docker run --rm -v "$PWD/dist:/dist:ro" -e VERSION="$VERSION" "$image" bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq "/dist/citizen-launcher_${VERSION}_amd64.deb" >/dev/null
              test "$(citizen-launcher --version)" = "$VERSION"
              test -f /etc/citizen-launcher/release-repo
              apt-get remove -y -qq citizen-launcher >/dev/null
              hash -r; ! command -v citizen-launcher'
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-deb
          path: |
            dist/citizen-launcher_*_amd64.deb
            dist/citizen-launcher-*-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: RPM package (Fedora)
    needs: backend
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Repair workspace ownership
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:13 \
            chown -R --no-dereference "$(id -u):$(id -g)" /workspace
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: backend-bin
          path: backend/bin
      - name: Build, inspect and smoke-test RPM in Fedora
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          RPM="dist/citizen-launcher-${VERSION}-1.linux.x86_64.rpm"

          cid="$(docker create \
            -e "CITIZEN_LAUNCHER_RELEASE_REPO=$CITIZEN_LAUNCHER_RELEASE_REPO" \
            -e "VERSION=$VERSION" \
            -e "RPM=$RPM" \
            -v "$PWD:/src:ro" \
            fedora:44 \
            bash -euo pipefail -c '
              dnf -y --setopt=install_weak_deps=False --setopt=tsflags=nodocs install git-core rpm-build
              mkdir -p /work
              cp -a /src/. /work/
              cd /work
              chmod 0755 backend/bin/citizen-launcher
              bash ./packaging/build-rpm.sh
              rpm -qpi "$RPM"
              rpm -qpl "$RPM"
              test "$(rpm -qp --qf "%{NAME} %{VERSION} %{ARCH}" "$RPM")" = "citizen-launcher ${VERSION} x86_64"
              ! rpm -qpl "$RPM" | grep -q "/usr/lib/.build-id"
              dnf -y --setopt=install_weak_deps=False install "./$RPM"
              test "$(citizen-launcher --version)" = "$VERSION"
              rpm -V citizen-launcher
              dnf -y remove citizen-launcher
            ')"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker start -a "$cid"
          mkdir -p dist
          docker cp "$cid:/work/$RPM" "$RPM"
          docker rm "$cid" >/dev/null
          trap - EXIT

          # docker cp creates the local file as the user invoking docker cp.
          test "$(stat -c %u "$RPM")" = "$(id -u)"
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-rpm
          path: dist/citizen-launcher-*-1.linux.x86_64.rpm
          if-no-files-found: error
          retention-days: 7

  rpm-opensuse:
    name: RPM install smoke test (openSUSE Tumbleweed)
    needs: rpm
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Repair workspace ownership
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:13 \
            chown -R --no-dereference "$(id -u):$(id -g)" /workspace
          rm -rf dist
      - uses: actions/download-artifact@v8
        with:
          name: pkg-rpm
          path: dist
      - name: Install and run in openSUSE
        run: |
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            opensuse/tumbleweed \
            bash -euo pipefail -c '
              RPM="$(ls /dist/citizen-launcher-*-1.linux.x86_64.rpm)"
              VERSION="$(rpm -qp --qf "%{VERSION}" "$RPM")"
              zypper --non-interactive refresh
              zypper --non-interactive install --allow-unsigned-rpm "$RPM"
              test "$(citizen-launcher --version)" = "$VERSION"
              rpm -V citizen-launcher
            '

  arch:
    name: pacman package (Arch Linux)
    needs: backend
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Repair workspace ownership
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            debian:13 \
            chown -R --no-dereference "$(id -u):$(id -g)" /workspace
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: backend-bin
          path: backend/bin
      - name: Build and smoke-test package in Arch Linux
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PKG="dist/citizen-launcher-${VERSION}-1-x86_64.pkg.tar.zst"

          cid="$(docker create \
            -e "CITIZEN_LAUNCHER_RELEASE_REPO=$CITIZEN_LAUNCHER_RELEASE_REPO" \
            -e "VERSION=$VERSION" \
            -e "PKG=$PKG" \
            -v "$PWD:/src:ro" \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed git
              useradd -m builder
              mkdir -p /work
              cp -a /src/. /work/
              chown -R builder:builder /work
              chmod 0755 /work/backend/bin/citizen-launcher
              cd /work
              runuser -u builder -- env "CITIZEN_LAUNCHER_RELEASE_REPO=$CITIZEN_LAUNCHER_RELEASE_REPO" bash ./packaging/build-arch.sh
              pacman -U --noconfirm "$PKG"
              test "$(citizen-launcher --version)" = "$VERSION"
              pacman -Qkk citizen-launcher
              pacman -R --noconfirm citizen-launcher
            ')"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker start -a "$cid"
          mkdir -p dist
          docker cp "$cid:/work/$PKG" "$PKG"
          docker rm "$cid" >/dev/null
          trap - EXIT

          test "$(stat -c %u "$PKG")" = "$(id -u)"
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-arch
          path: dist/citizen-launcher-*-1-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
